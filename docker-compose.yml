# Local PostgreSQL for development. Start it with `docker compose up -d`.
# These credentials are for local development only; production uses the
# host's managed database through DATABASE_URL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: order_tagger
      POSTGRES_PASSWORD: order_tagger
      POSTGRES_DB: order_tagger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_tagger -d order_tagger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
