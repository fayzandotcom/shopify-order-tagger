# Production app (order-tagger). For local development use shopify.app.dev.toml (`npm run dev`).
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "cac2d21ff57d49b43885942dd28299b1"
name = "Order Tagger"
application_url = "https://shopify-order-tagger.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[auth]
redirect_urls = [ "https://shopify-order-tagger.onrender.com/auth/callback" ]

[build]
include_config_on_deploy = true
# Production URLs are fixed to Render; never repoint them to a dev tunnel.
automatically_update_urls_on_dev = false
